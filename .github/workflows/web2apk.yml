name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL Icon (PNG/JPG) - kosongkan untuk default'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  APP_NAME: ${{ github.event.inputs.app_name }}
  WEB_URL: ${{ github.event.inputs.web_url }}
  ICON_URL: ${{ github.event.inputs.icon_url }}
  PACKAGE_NAME: com.web2apk.build${{ github.run_number }}

jobs:
  build:
    name: Build Web to APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔎 Validate Inputs
        run: |
          set -e
          case "$WEB_URL" in
            http://*|https://*) ;;
            *) echo "❌ URL harus diawali http:// atau https://"; exit 1 ;;
          esac
          if [ -z "$(printf '%s' "$APP_NAME" | tr -d '[:space:]')" ]; then
            echo "❌ Nama aplikasi kosong"; exit 1
          fi
          echo "✅ Input valid"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 📦 Install Dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y python3-pil file

      - name: 🖼️ Download & Prepare App Icon
        run: |
          set -e
          mkdir -p assets res/icon/android
          rm -f assets/icon_source assets/icon_original.png
          echo "📥 Icon URL: $ICON_URL"

          if [ -n "$ICON_URL" ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 60 \
              -A "Mozilla/5.0" "$ICON_URL" -o assets/icon_source || true
          fi

          # Pastikan file benar-benar gambar (bukan halaman HTML / redirect).
          ICON_VALID=0
          if [ -s assets/icon_source ]; then
            if python3 -c "from PIL import Image; Image.open('assets/icon_source').verify()" 2>/dev/null; then
              ICON_VALID=1
            else
              echo "⚠️ File yang terdownload bukan gambar valid (kemungkinan halaman HTML/redirect)"
            fi
          fi

          if [ "$ICON_VALID" -ne 1 ]; then
            echo "⚠️ Icon tidak tersedia/tidak valid; membuat icon default"
            rm -f assets/icon_source
            python3 - <<'PYICON'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGBA", (512, 512), (108, 92, 231, 255))
          d = ImageDraw.Draw(img)
          text = "APK"
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 120)
          except Exception:
              font = ImageFont.load_default()
          b = d.textbbox((0, 0), text, font=font)
          d.text(((512-(b[2]-b[0]))/2, (512-(b[3]-b[1]))/2-10), text,
                  fill=(255,255,255,255), font=font)
          img.save("assets/icon_source", "PNG", optimize=True)
          PYICON
          fi

          python3 - <<'PYICONPREP'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Path("assets/icon_source")
          out = Path("assets/icon_original.png")
          try:
              img = Image.open(src)
              img = ImageOps.exif_transpose(img)
              img.load()
          except Exception as e:
              print(f"❌ Invalid icon: {e}")
              raise SystemExit(1)
          img = img.convert("RGBA")
          img.save(out, "PNG", optimize=True)
          print(f"✅ Icon: {img.width}x{img.height} RGBA PNG")
          PYICONPREP

          python3 - <<'PYICONS'
          from PIL import Image
          src = Image.open("assets/icon_original.png").convert("RGBA")
          for size in (48, 72, 96, 144, 192):
              im = src.copy()
              im.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(im, ((size-im.width)//2, (size-im.height)//2))
              canvas.save(f"res/icon/android/icon-{size}.png", "PNG", optimize=True)
          print("✅ Android icons generated")
          PYICONS

      - name: 🌐 Generate WebView Project
        run: |
          set -e
          P=web2apk-project
          mkdir -p $P/app/src/main/java/com/web2apk/app
          mkdir -p $P/app/src/main/res/{layout,values,xml}
          mkdir -p $P/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          mkdir -p $P/gradle/wrapper

          # Nama app & URL ditulis lewat Python dengan escaping yang benar,
          # bukan disisipkan langsung ke shell/XML/Java (mencegah build rusak
          # dan injection dari input user).
          python3 - <<'PYGEN'
          import os, json
          from xml.sax.saxutils import escape
          from pathlib import Path

          name = " ".join(os.environ["APP_NAME"].split())[:60]
          url = os.environ["WEB_URL"].strip()

          # --- strings.xml (escape sesuai aturan resource Android) ---
          s = escape(name)
          s = s.replace("\\", "\\\\").replace("'", "\\'").replace('"', '\\"')
          if s[:1] in ("@", "?"):
              s = "\\" + s
          Path("web2apk-project/app/src/main/res/values/strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'    <string name="app_name">{s}</string>\n</resources>\n',
              encoding="utf-8")

          # --- AndroidManifest.xml ---
          Path("web2apk-project/app/src/main/AndroidManifest.xml").write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.web2apk.app.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''', encoding="utf-8")

          # --- MainActivity.java (URL jadi string literal Java yang aman) ---
          java_url = json.dumps(url)
          Path("web2apk-project/app/src/main/java/com/web2apk/app/MainActivity.java").write_text(
          '''package com.web2apk.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.view.Window;
          import android.view.WindowManager;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setSupportZoom(true);
                  webSettings.setBuiltInZoomControls(true);
                  webSettings.setDisplayZoomControls(false);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(__URL__);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) { webView.goBack(); }
                  else { super.onBackPressed(); }
              }
          }
          '''.replace("__URL__", java_url), encoding="utf-8")
          print("✅ strings.xml, AndroidManifest.xml, MainActivity.java generated")
          PYGEN

          cat > $P/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          cat > $P/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#6C5CE7</item>
                  <item name="android:navigationBarColor">#6C5CE7</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6C5CE7</color>
              <color name="colorPrimaryDark">#5A4BD1</color>
              <color name="colorAccent">#00CEC9</color>
          </resources>
          EOF

          echo "✅ Project files ready"

      - name: 🔧 Create Gradle Files
        run: |
          set -e
          P=web2apk-project

          cat > $P/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          # Nilai dinamis dibaca dari environment (PACKAGE_NAME, GITHUB_RUN_NUMBER,
          # KS_PASS), jadi file ini statis dan aman dari injection.
          cat > $P/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace System.getenv("PACKAGE_NAME")
              compileSdk 34
              defaultConfig {
                  applicationId System.getenv("PACKAGE_NAME")
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("release.jks")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "web2apk"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > $P/settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_PROJECT); repositories { google(); mavenCentral() } }
          rootProject.name = 'Web2APK'
          include ':app'
          EOF

          cat > $P/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "✅ Gradle files created"

      - name: 📦 Setup Gradle Wrapper
        run: |
          set -e
          cd web2apk-project
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew"
          chmod +x gradlew
          echo "✅ Gradle wrapper ready"

      - name: 🖼️ Copy & Validate Icons
        run: |
          set -e
          RES="web2apk-project/app/src/main/res"

          cp res/icon/android/icon-48.png  "$RES/mipmap-mdpi/ic_launcher.png"
          cp res/icon/android/icon-72.png  "$RES/mipmap-hdpi/ic_launcher.png"
          cp res/icon/android/icon-96.png  "$RES/mipmap-xhdpi/ic_launcher.png"
          cp res/icon/android/icon-144.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp res/icon/android/icon-192.png "$RES/mipmap-xxxhdpi/ic_launcher.png"

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            FILE="$RES/$dir/ic_launcher.png"
            test -s "$FILE"
            python3 -c "from PIL import Image; Image.open('$FILE').verify()"
            file "$FILE"
          done
          echo "✅ All launcher icons are valid PNG files"

      - name: 🔐 Generate Signing Keystore
        run: |
          set -e
          KS_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore web2apk-project/release.jks \
            -alias web2apk -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Web2APK, O=Web2APK, C=ID"
          echo "✅ Keystore generated"

      - name: 🔨 Build APK (signed release)
        run: |
          cd web2apk-project
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ BUILD FAILED"
            tail -80 /tmp/build.log
            exit 1
          fi
          echo "✅ Build success!"

      - name: ✅ Verify APK Signature
        run: |
          set -e
          APK_FILE=$(find web2apk-project/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then echo "❌ No release APK found!"; exit 1; fi
          case "$APK_FILE" in
            *unsigned*) echo "❌ APK masih unsigned: $APK_FILE"; exit 1 ;;
          esac
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK_DIR/build-tools/34.0.0/apksigner" verify --verbose "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "✅ APK signed & verified"

      - name: 📱 Rename APK
        id: rename
        run: |
          set -e
          CLEAN_NAME=$(printf '%s' "$APP_NAME" | sed 's/[^a-zA-Z0-9]/_/g' | cut -c1-40)
          [ -z "$CLEAN_NAME" ] && CLEAN_NAME="app"
          mkdir -p dist
          cp "$APK_FILE" "dist/${CLEAN_NAME}_web2apk.apk"
          echo "✅ APK: dist/${CLEAN_NAME}_web2apk.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          # Nama artifact statis (tanpa nama app) supaya tidak error kalau
          # nama app mengandung karakter terlarang; tetap mengandung "apk".
          name: Web2APK-build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 📊 Build Summary
        run: |
          echo "🎉 BUILD COMPLETE!"
          echo "🌐 $WEB_URL"
          ls -lh dist/
