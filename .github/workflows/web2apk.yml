name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website yang akan dibuka di WebView'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon aplikasi (opsional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Initialize diagnostic log
        run: |
          set -e
          : > "$GITHUB_WORKSPACE/web2apk-debug.log"
          echo "=== WEB2APK DEBUG LOG ===" >> "$GITHUB_WORKSPACE/web2apk-debug.log"
          echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_WORKSPACE/web2apk-debug.log"
          echo "App: ${{ inputs.app_name }}" >> "$GITHUB_WORKSPACE/web2apk-debug.log"
          echo "URL: ${{ inputs.web_url }}" >> "$GITHUB_WORKSPACE/web2apk-debug.log"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/web2apk-debug.log") 2>&1
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android project
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/web2apk-debug.log") 2>&1

          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse
          url = os.environ.get('WEB_URL','').strip()
          name = os.environ.get('APP_NAME','').strip()
          parsed = urlparse(url)
          if parsed.scheme not in ('http','https') or not parsed.netloc:
              raise SystemExit('ERROR: web_url harus berupa URL http:// atau https:// yang valid.')
          if not name:
              raise SystemExit('ERROR: app_name tidak boleh kosong.')
          if len(name) > 50:
              raise SystemExit('ERROR: app_name terlalu panjang (maksimal 50 karakter).')
          print('URL valid:', url)
          print('App name valid:', name)
          PY

          rm -rf build-web2apk
          mkdir -p build-web2apk/app/src/main/java/com/web2apk/app
          mkdir -p build-web2apk/app/src/main/res/{layout,values,mipmap-mdpi,mipmap-hdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}

          cat > build-web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Web2Apk"
          include ':app'
          EOF

          cat > build-web2apk/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '7.4.2' apply false }
          EOF

          cat > build-web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > build-web2apk/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.web2apk.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release { minifyEnabled false; shrinkResources false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat > build-web2apk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:usesCleartextTraffic="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > build-web2apk/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Web2Apk</string>
          </resources>
          EOF

          cat > build-web2apk/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > build-web2apk/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/white</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
              </style>
          </resources>
          EOF

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          import xml.sax.saxutils as xml
          import re
          url = os.environ['WEB_URL'].strip()
          encoded = base64.b64encode(url[::-1].encode()).decode()
          java = f'''package com.web2apk.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {{
              private static final String ENCODED_URL = "{encoded}";
              @SuppressLint("SetJavaScriptEnabled")
              @Override public void onCreate(Bundle state) {{
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setSupportZoom(false);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl(decode(ENCODED_URL));
              }}
              private String decode(String value) {{
                  try {{
                      byte[] data = android.util.Base64.decode(value, android.util.Base64.DEFAULT);
                      return new String(data, java.nio.charset.StandardCharsets.UTF_8);
                  }} catch (Exception e) {{ return "https://google.com"; }}
              }}
          }}
          '''
          Path('build-web2apk/app/src/main/java/com/web2apk/app/MainActivity.java').write_text(java)
          app = os.environ['APP_NAME'].strip() or 'Web2Apk'
          p = Path('build-web2apk/app/src/main/res/values/strings.xml')
          s = p.read_text()
          p.write_text(re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{xml.escape(app)}</string>', s))
          PY

          # Default lightweight icons; replace them when icon_url is provided.
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$d" in mdpi) size=48;; hdpi) size=72;; xhdpi) size=96;; xxhdpi) size=144;; xxxhdpi) size=192;; esac
            convert -size "${size}x${size}" xc:'#2196F3' "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher.png" "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

          if [ -n "$ICON_URL" ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 60 "$ICON_URL" -o /tmp/icon-source
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case "$d" in mdpi) size=48;; hdpi) size=72;; xhdpi) size=96;; xxhdpi) size=144;; xxxhdpi) size=192;; esac
              convert /tmp/icon-source -auto-orient -thumbnail "${size}x${size}^" -gravity center -extent "${size}x${size}" PNG32 "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher.png" "build-web2apk/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
          fi

      - name: Install Gradle 7.5
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/web2apk-debug.log") 2>&1
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 https://services.gradle.org/distributions/gradle-7.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.5/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build release APK
        working-directory: build-web2apk
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/web2apk-debug.log") 2>&1
          gradle --no-daemon --stacktrace --console=plain assembleRelease

      - name: Collect APK
        if: success()
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/web2apk-debug.log") 2>&1
          mkdir -p artifacts
          test -s build-web2apk/app/build/outputs/apk/release/app-release.apk
          cp build-web2apk/app/build/outputs/apk/release/app-release.apk artifacts/web2apk-release.apk
          ls -lh artifacts/web2apk-release.apk

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-debug-log
          path: ${{ github.workspace }}/web2apk-debug.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-build
          path: artifacts/web2apk-release.apk
          if-no-files-found: error
          retention-days: 7
